const MAXKM=800;
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,p=r(c-a),q=r(d-b),h=Math.sin(p/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(q/2)**2;return 12742*Math.asin(Math.sqrt(h))}; // Haversine
const RELATED={Wood:['Furniture','Construction'],Furniture:['Wood'],Construction:['Wood','Metal'],Metal:['Construction'],Textiles:[],Electronics:[]};
function condFit(l,t){ if(l.cond==='Scrap')return t==='recycler'?1:0;
 if(l.cat==='Electronics')return l.cond==='Working'?({school:1,ngo:1,repair:.5}[t]||0):({repair:1,recycler:.4}[t]||0);
 if(l.cat==='Furniture')return {community:1,school:1,ngo:.6,upcycler:.5,repair:l.cond==='Needs Repair'?.8:0}[t]||0;
 if(l.cat==='Construction')return {community:1,upcycler:1,ngo:.8}[t]||0;
 return {recycler:1,upcycler:1,ngo:.4}[t]||0}
/** score = .40 category + .25 distance + .20 condition fit + .15 urgency. Returns null for illegal e-waste routes. */
function match(l,r){
 if(l.cat==='Electronics'&&l.cond==='Scrap'&&!(r.type==='recycler'&&r.ewaste))return null;
 const cat=r.accepts.includes(l.cat)?1:(RELATED[l.cat]||[]).some(c=>r.accepts.includes(c))?.5:0;
 const d=km(l.lat,l.lng,r.lat,r.lng),dist=Math.max(0,1-d/MAXKM),fit=condFit(l,r.type);
 const wait=Math.min(1,(Date.now()-l.date)/864e5/30),urg=Math.min(1,r.urgency*.7+wait*.3)+(r.needs.some(n=>n.cat===l.cat)?.1:0);
 const parts={cat,dist,fit,urg:Math.min(1,urg)};
 return{r,d,parts,score:Math.round(100*(.4*parts.cat+.25*parts.dist+.2*parts.fit+.15*parts.urg))}}
function matches(l){return R.map(r=>match(l,r)).filter(m=>m&&m.parts.cat>0&&m.parts.fit>0).sort((a,b)=>b.score-a.score)}
function bestMatch(l){return matches(l)[0]}

 <div class="card"><h3>By category</h3><div class="row" style="flex-wrap:nowrap"><div style="width:120px;height:120px;border-radius:50%;flex:none;background:conic-gradient(${stops})" role="img" aria-label="Category donut"></div><div>${cs.map((c,i)=>`<small><span style="color:${cols[i]}">■</span> ${c} ${m.bycat[c]||0} kg</small><br>`).join('')}</div></div></div></div><br>
 <div class="row" style="align-items:flex-start"><div class="card"><h3>Reuse, repair, recycle (kg)</h3>${['Reuse','Repair','Recycle'].map(k=>`<small>${k}: ${m.route[k]}</small><div class="bar"><i style="width:${m.route[k]/tot*100}%"></i></div>`).join('')}</div>
 <div class="card"><h3>Top donors</h3>${don.map((d,i)=>`<p style="margin:4px 0">${i+1}. ${esc(d[0])}: ${d[1]} kg</p>`).join('')}</div></div><br>
 <div class="card"><h3>Activity across cities</h3>${mapSvg(S.listings.map(l=>[l.lat,l.lng,l.cat,l.id]))}<small style="color:var(--mute)">${cn.map(c=>c.join(': ')).join(' · ')}</small></div><br>
 <details class="card" open><summary>Assumptions (illustrative, not audited)</summary><p style="color:var(--mute)">CO₂e saved = weight × factor below. Factors are placeholders for the demo. Weights are estimated from category and quantity.</p>${Object.entries(CATS).map(([c,v])=>`<small>${c}: ${v.ef} kg CO₂e per kg</small><br>`).join('')}</details></section></div>`}
function csv(){const rows=[['id','title','category','condition','qty','kg','city','status','recipient']].concat(S.listings.map(l=>[l.id,l.title,l.cat,l.cond,l.qty,l.wt,l.city,l.status,l.rid?rec(l.rid).name:'']));
 const b=new Blob([rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='circularloop-report.csv';a.click()}
function admin(){if(S.role!='Admin')return `<div class="wrap"><section><div class="card"><h2>Admin only</h2><p>Switch role to Admin in the navigation to review listings.</p></div></section></div>`;
 const m=metrics();return `<div class="wrap"><section><h2>Admin review</h2><p class="sub">Verify listings and organisations before they go live.</p><div class="card scroll"><table class="tbl"><tr><th>Listing</th><th>Donor</th><th>Status</th><th>Review</th></tr>${S.listings.slice(0,15).map(l=>`<tr><td><a href="#listing/${l.id}">${esc(l.title)}</a></td><td>${esc(l.donor)}</td><td>${l.flag?'Flagged':l.rej?'Rejected':l.ok?'Verified':'Pending'}</td><td><button class="btn sm" onclick="rv(${l.id},'ok')">Verify</button> <button class="btn sm ghost" onclick="rv(${l.id},'rej')">Reject</button> <button class="btn sm ghost" onclick="rv(${l.id},'flag')">Flag</button></td></tr>`).join('')}</table></div><br><div class="card"><h3>Organisations</h3>${R.map(r=>`<p style="margin:3px 0">${r.verified?'Verified':'Unverified'} ${esc(r.name)} <small>(${r.type}${r.auth?', '+r.auth:''})</small> <button class="btn sm ghost" onclick="rec(${r.id}).verified=!rec(${r.id}).verified;render()">Toggle</button></p>`).join('')}</div></section></div>`}
function rv(id,k){if(S.role!='Admin')return;const l=lst(id);l.ok=k=='ok';l.rej=k=='rej';l.flag=k=='flag';if(k=='rej')l.status='Available';save();render()}
const SL=[
['1 min','The problem',['Usable laptops, furniture and building material are thrown away because the people who need them cannot find them.','Schools, NGOs and repair groups wait for donations that never reach them.','Recyclers receive items that could have been reused or repaired first.'],'Say: today there is no simple place where a donor and a recipient meet. Add your own local e-waste figure here.',null],
['1 min','Our solution',['One platform where donors list items and recipients request them.','A transparent score suggests the best recipient for every item.','Pickup is scheduled in the app, and impact is measured automatically.'],'Say: list, match, pickup, impact. Four steps, one screen each.',null],
['3 min','Live demo',['Sign in and list a laptop (2 minutes of typing is not needed, use a prepared item).','Open the listing and show the ranked recipients and the Why this match breakdown.','Request, approve, schedule a pickup, mark it completed, then open Impact.'],'Tip: keep one Available listing ready. Mention that the demo uses sample data.',['#browse','Open the live demo']],
['1.5 min','How matching works',['Score = 40% category, 25% distance, 20% condition fit, 15% urgency.','Working electronics go to schools and NGOs, broken ones to repair groups.','Scrap electronics go only to recyclers with an e-waste authorisation number.'],'Say: the score is a simple formula, not a black box, so every decision can be explained to an auditor.',null],
['1 min','Value for your organisation',['Less waste sent to landfill and a clear record of every item.','Ready-made reports: kilograms diverted, CO₂e avoided, reuse rate.','Low running cost: donors and recipients arrange pickup directly.'],'Say: the CO₂e figures use illustrative factors today. We would agree official factors with you.',['#impact','Show the impact report']],
['1 min','Policy alignment',['E-Waste (Management) Rules, 2022 and Solid Waste Management Rules, 2016.','Mission LiFE and Swachh Bharat Mission.','Follows the waste hierarchy: reduce, reuse, repair, recycle.'],'Say: the design routes items the way the rules expect, with reuse and repair before recycling.',null],
['1 min','What is built and what comes next',['Built: a working web prototype with sample data and a demo sign-in.','Next: real accounts and database, WhatsApp or SMS alerts, real maps, mobile app.','Later: integrations with your existing systems.'],'Be honest: this is a prototype. The next phase turns it into a production system.',null],
['0.5 min','Next steps',['Agree a pilot with 3 to 5 organisations.','Confirm the item categories and the cities to start with.','Plan the production build and review it with your team.'],'End with a clear ask: which pilot partners and what start date?',null]];
let ps=0;
function present(){const s=SL[ps];return `<div class="wrap"><section><h2>Client walkthrough</h2><p class="sub">A 10-minute presentation. Use the buttons or the left and right arrow keys.</p><div class="bar"><i style="width:${(ps+1)/SL.length*100}%"></i></div><br><div class="card slide"><small>Slide ${ps+1} of ${SL.length}, about ${s[0]}</small><h2 style="font-size:40px;margin:8px 0 14px">${s[1]}</h2><ul>${s[2].map(x=>`<li>${x}</li>`).join('')}</ul>${s[4]?`<p><a class="btn" href="${s[4][0]}" style="text-decoration:none;display:inline-block">${s[4][1]}</a></p>`:''}<div class="note"><b>Speaker note</b><br>${s[3]}</div></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="ps=Math.max(0,ps-1);render()" ${ps?'':'disabled'}>Previous</button><button class="btn" onclick="ps=Math.min(SL.length-1,ps+1);render()" ${ps<SL.length-1?'':'disabled'}>Next</button></div></section></div>`}
function denied(){return `<div class="wrap" style="padding:60px 0"><div class="card"><h2>Not available for your role</h2><p>You are signed in as ${S.role}. This page is for other roles.</p><a class="btn" href="#home" style="text-decoration:none">Back to home</a></div></div>`}
function nf(){return `<div class="wrap" style="text-align:center;padding:70px 0"><svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="var(--g)" stroke-width="5" stroke-dasharray="70 18"/><path d="M30 4l6 8-10 2z" fill="var(--g)"/></svg><h2>This page has looped away</h2><p>We couldn’t find what you were looking for.</p><a class="btn" href="#home" style="text-decoration:none">Back to home</a></div>`}
// ---------- shell ----------
function render(){const h=(ROUTE!==null?ROUTE:location.hash.slice(1))||'home',[p,a]=h.split('/');const app=$('app');
 if(!S.user){app.innerHTML=signin();return}
 const ALLOW={Donor:['home','browse','add','pickups','impact','present'],Recipient:['home','browse','pickups','impact','recipient','present'],Admin:['home','browse','pickups','impact','admin','present']};
 const tabs=[['home','home'],['browse','browse'],['add','add'],['pickups','pick'],['impact','imp'],['recipient','rec'],['admin','admin'],['present','Client walkthrough']].filter(x=>(ALLOW[S.role]||[]).includes(x[0]));
 const pg={home,browse,add,pickups,impact,recipient,admin,present}[p];
 app.innerHTML=`<nav aria-label="Main"><a class="logo" href="#home">${logo}CircularLoop</a>${tabs.map(([k,v])=>`<a href="#${k}" class="${p==k?'on':''}"><span class="sym" aria-hidden="true">${NS[k]}</span>${t(v)}</a>`).join('')}<span class="chip" style="margin:6px">${esc(S.user)} · ${S.role}</span><select aria-label="Language" style="width:auto" onchange="S.lang=this.value;save();render()"><option value="en">English</option><option value="te" ${S.lang=='te'?'selected':''}>తెలుగు</option><option value="hi" ${S.lang=='hi'?'selected':''}>हिन्दी</option></select><button class="btn ghost sm" onclick="theme()" aria-label="Toggle dark mode">Theme</button><button class="btn ghost sm" onclick="S.user=null;save();render()">${t('out')}</button></nav><main>${p=='listing'?detail(a):pg?((ALLOW[S.role]||[]).includes(p)?pg():denied()):nf()}</main><footer class="wrap">Sample data shown for demonstration. Aligned with the E-Waste (Management) Rules 2022, Solid Waste Management Rules 2016 and Mission LiFE.</footer>`;
 if(p=='home')document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1200);e.textContent=Math.round(to*k).toLocaleString('en-IN');if(k<1)requestAnimationFrame(f)})(t0)})}
let ROUTE=null;
function go(h){ROUTE=h;try{location.hash=h}catch(e){}render();scrollTo(0,0)}
const HX={"authMode='up';render()":()=>{authMode='up';render()},"authMode='in';render()":()=>{authMode='in';render()},"S.view='grid';render()":()=>{S.view='grid';render()},"S.view='list';render()":()=>{S.view='list';render()},"S.view='map';render()":()=>{S.view='map';render()},"S.user=null;save();render()":()=>{S.user=null;save();render()},"rd();step--;render()":()=>{rd();step--;render()},"ps=Math.max(0,ps-1);render()":()=>{ps=Math.max(0,ps-1);render()},"ps=Math.min(SL.length-1,ps+1);render()":()=>{ps=Math.min(SL.length-1,ps+1);render()}};
const HE={"form.cat=this.value;form.wt=CATS[this.value].w*form.qty":el=>{form.cat=el.value;form.wt=CATS[el.value].w*form.qty},"S.lang=this.value;save();render()":el=>{S.lang=el.value;save();render()},"S.f.st=this.value;render()":el=>{S.f.st=el.value;render()},"S.f.sort=this.value;render()":el=>{S.f.sort=el.value;render()},"S.f.km=+this.value;render()":el=>{S.f.km=+el.value;render()},"S.f.cond=this.value;render()":el=>{S.f.cond=el.value;render()},"S.f.cat=this.value;render()":el=>{S.f.cat=el.value;render()}};
function runH(code,el,ev){code=code.trim();if(HX[code])return HX[code]();if(HE[code])return HE[code](el);
 let m=code.match(/^S\.f\.cat='(\w+)'$/);if(m){S.f.cat=m[1];return}
 m=code.match(/^rec\((\d+)\)\.verified=!rec\(\d+\)\.verified;render\(\)$/);if(m){const r=rec(+m[1]);r.verified=!r.verified;render();return}
 m=code.match(/^(\w+)\((.*)\)$/);if(!m)return;
 const f=m[1]=='print'?()=>window.print():window[m[1]];if(typeof f!='function')return;
 const args=m[2].trim()?m[2].split(',').map(a=>{a=a.trim();if(a=='this')return el;if(a=='event')return ev;if(a=='this.value')return el.value;if(a=='+this.value')return +el.value;if(/^-?\d+(\.\d+)?$/.test(a))return +a;if(/^'.*'$/.test(a))return a.slice(1,-1);return undefined}):[];
 return f(...args)}
function wire(){document.querySelectorAll('[onclick],[onchange],[oninput],[onsubmit]').forEach(el=>{for(const t of ['click','change','input','submit']){const v=el.getAttribute('on'+t);if(v!==null){el.setAttribute('data-on-'+t,v);el.removeAttribute('on'+t)}}})}
new MutationObserver(wire).observe(document.body,{childList:true,subtree:true});
['click','change','input','submit'].forEach(t=>document.addEventListener(t,ev=>{const el=ev.target.closest&&ev.target.closest('[data-on-'+t+']');if(!el)return;try{runH(el.getAttribute('data-on-'+t),el,ev)}catch(e){toast('Error: '+e.message)}}));
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href').slice(1);if(!h)return;e.preventDefault();go(h)});
addEventListener('error',e=>{try{toast('Error: '+e.message)}catch(x){}});addEventListener('unhandledrejection',e=>{try{toast('Error: '+(e.reason&&e.reason.message||e.reason))}catch(x){}});
if(matchMedia('(pointer:fine)').matches){const cu=document.createElement('div');cu.id='cur';document.body.append(cu);addEventListener('mousemove',e=>{cu.style.opacity=1;cu.style.transform=`translate(${e.clientX-16}px,${e.clientY-16}px)`;cu.classList.toggle('big',!!(e.target.closest&&e.target.closest('a,button,summary,select,.lst,[onclick]')))})}
function theme(){const d=document.documentElement;const dark=getComputedStyle(d).getPropertyValue('--bg').trim()=='#0b1620';d.dataset.theme=dark?'light':'dark'}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h===ROUTE)return;ROUTE=h;render();scrollTo(0,0)});load();render();try{if(S.user&&!localStorage.getItem('cl4t'))tour(0)}catch(e){}
addEventListener('keydown',e=>{if((ROUTE!==null?ROUTE:location.hash.slice(1))=='present'){if(e.key=='ArrowRight'&&ps<SL.length-1){ps++;render()}if(e.key=='ArrowLeft'&&ps>0){ps--;render()}}});
